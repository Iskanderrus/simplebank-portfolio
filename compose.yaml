services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: simplebank
      POSTGRES_USER: simplebank
      POSTGRES_PASSWORD: simplebank
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplebank -d simplebank"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: insecure-local-development-key
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
